<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto 1 — Saudação Personalizada</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>
    <div class="container">
        <h1>Saudação</h1>
        <p class="subtitulo">Escolha o idioma, digite seu nome e clique no botão:</p>

        <!-- Seletor de idioma: o valor de cada option é o "código"
             que o JS vai usar no switch/case (pt, en, es). -->
        <select id="seletor-idioma">
            <option value="pt">Português</option>
            <option value="en">English</option>
            <option value="es">Español</option>
            <option value="zh">中文 (普通话)</option>
        </select>

        <!-- Campo de entrada: o usuário digita o nome aqui.
             O atributo "id" permite que o JS encontre este campo. -->
        <input type="text" id="campo-nome" placeholder="Seu nome...">

        <!-- Botão: o clique será capturado pelo JS. -->
        <button id="btn-saudar">Saudar</button>

        <!-- Área onde o resultado será exibido pelo JS.
             Começa vazia — o JS vai preencher. -->
        <p id="resultado"></p>
    </div>

    <script src="script1.js"></script>
</body>
</html>
